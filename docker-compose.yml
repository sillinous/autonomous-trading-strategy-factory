services:
  atsf:
    build: .
    ports:
      # Bind the development container to localhost by default. Put an authenticated
      # reverse proxy in front of it before exposing the service to a network.
      - "127.0.0.1:8000:8000"
    environment:
      ATSF_REGISTRY_PATH: /data/atsf.sqlite3
    volumes:
      - atsf-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atsf-data:
