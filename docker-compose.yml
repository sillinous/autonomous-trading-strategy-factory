services:
  atsf:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ATSF_REGISTRY_PATH: /data/atsf.sqlite3
      ATSF_API_KEY: ${ATSF_API_KEY:-}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      ATSF_SEC_USER_AGENT: ${ATSF_SEC_USER_AGENT:-}
    volumes:
      - atsf-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  atsf-data:
