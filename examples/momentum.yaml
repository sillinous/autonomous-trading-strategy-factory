name: momentum-regime-v1
version: 1
universe:
  - SPY
timeframe: 1d
indicators:
  - name: sma
    source: close
    period: 200
  - name: rsi
    source: close
    period: 14
entry:
  all:
    - left: close
      comparator: ">"
      right: sma
    - left: rsi
      comparator: ">"
      right: 50
exit:
  any:
    - left: rsi
      comparator: "<"
      right: 45
side: long
position_sizing:
  method: volatility_target
  value: 0.12
  max_position: 0.25
risk:
  max_leverage: 1
  max_position: 0.25
  stop_loss: 0.08
  max_drawdown: 0.15
metadata:
  purpose: example
