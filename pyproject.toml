[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-trading-strategy-factory"
version = "0.1.0"
description = "Autonomous quantitative strategy research and backtesting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atsf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
